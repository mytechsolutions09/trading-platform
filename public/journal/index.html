<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trading Journal — Track. Analyze. Improve.</title>
  <meta name="description" content="A premium trading journal to track trades, analyze performance, and master your psychology.">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
</head>
<body>

  <!-- ── Mobile menu toggle ────────────────────────────── -->
  <button class="menu-toggle" aria-label="Open menu">☰</button>

  <!-- ── Sidebar ───────────────────────────────────────── -->
  <aside class="sidebar" role="navigation" aria-label="Main navigation">
    <div class="brand">
      <div class="brand-icon">
        <svg class="svg-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><polyline points="18.7 8 13 14 9 10 3.7 15"/></svg>
      </div>
      <div>
        <div class="brand-name">TradingJournal</div>
        <div class="brand-sub">Your edge, documented</div>
      </div>
    </div>

    <nav aria-label="Pages">
      <div class="nav-section">Overview</div>
      <button class="nav-item" data-page="dashboard" id="nav-dashboard">
        <span class="nav-icon">
          <svg class="svg-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </span> Dashboard
      </button>

      <div class="nav-section">Trading</div>
      <button class="nav-item" data-page="trades" id="nav-trades">
        <span class="nav-icon">
          <svg class="svg-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M9 9h6"/><path d="M9 13h6"/><path d="M9 17h6"/></svg>
        </span> Trade Log
      </button>
      <button class="nav-item" data-page="analytics" id="nav-analytics">
        <span class="nav-icon">
          <svg class="svg-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        </span> Analytics
      </button>

      <div class="nav-section">Mindset</div>
      <button class="nav-item" data-page="psychology" id="nav-psychology">
        <span class="nav-icon">
          <svg class="svg-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96-.44 2.5 2.5 0 0 1 0-3.12 3 3 0 0 1 0-4.88 2.5 2.5 0 0 1 0-3.12A2.5 2.5 0 0 1 9.5 2Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96-.44 2.5 2.5 0 0 0 0-3.12 3 3 0 0 0 0-4.88 2.5 2.5 0 0 0 0-3.12A2.5 2.5 0 0 0 14.5 2Z"/></svg>
        </span> Psychology
      </button>
      <button class="nav-item" data-page="journal" id="nav-journal">
        <span class="nav-icon">
          <svg class="svg-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h10"/><path d="M6 10h10"/></svg>
        </span> Journal
      </button>

      <div class="nav-section">System</div>
      <button class="nav-item" data-page="settings" id="nav-settings">
        <span class="nav-icon">
          <svg class="svg-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </span> Settings
      </button>

      <div class="nav-section">Navigation</div>
      <a href="/" target="_top" class="nav-item" style="color: var(--cyan-l); font-weight: 600; text-decoration: none;">
        <span class="nav-icon">
          <svg class="svg-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        </span> Back to Platform
      </a>
    </nav>

    <div class="sidebar-footer">
      <button class="nav-item" id="theme-toggle" style="margin-bottom: 12px;" aria-label="Toggle theme">
        <span class="nav-icon" id="theme-toggle-icon">
          <svg class="svg-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </span> <span id="theme-toggle-text">Light Mode</span>
      </button>
      <div class="capital-card">
        <div class="capital-label">Account Value</div>
        <div class="capital-value" id="capital-display">—</div>
      </div>
    </div>
  </aside>

  <!-- ── Sidebar overlay (mobile) ─────────────────────── -->
  <div class="sidebar-overlay" aria-hidden="true"></div>

  <!-- ── Main content ─────────────────────────────────── -->
  <main class="main" id="app-content" role="main">
    <!-- Pages are rendered here by app.js -->
  </main>

  <!-- ══════════════════════════════════════════════════
       Add / Edit Trade Modal
  ═══════════════════════════════════════════════════ -->
  <dialog id="trade-modal" closedby="any" aria-labelledby="trade-modal-title">
    <div class="modal-header">
      <h2 class="modal-title" id="trade-modal-title">Log New Trade</h2>
      <button class="modal-close" id="modal-close" aria-label="Close">✕</button>
    </div>
    <div class="modal-body">
      <div id="modal-body-content"><!-- injected by app.js --></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="modal-cancel-btn" onclick="closeTradeModal()">Cancel</button>
      <button class="btn btn-primary" id="modal-submit">Save Trade</button>
    </div>
  </dialog>

  <!-- ══════════════════════════════════════════════════
       Trade Detail Modal
  ═══════════════════════════════════════════════════ -->
  <dialog id="detail-modal" closedby="any" aria-labelledby="detail-modal-title">
    <div class="modal-header">
      <h2 class="modal-title" id="detail-modal-title">Trade Details</h2>
      <button class="modal-close" id="detail-close" aria-label="Close">✕</button>
    </div>
    <div class="modal-body" id="detail-body">
      <!-- injected by app.js -->
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="document.getElementById('detail-modal').close()">Close</button>
      <button class="btn btn-primary" id="detail-edit-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        Edit Trade
      </button>
    </div>
  </dialog>

  <!-- ── Toast container ──────────────────────────────── -->
  <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

  <!-- ── Scripts ──────────────────────────────────────── -->
  <script src="chart.js"></script>
  <script src="app.js"></script>
</body>
</html>
